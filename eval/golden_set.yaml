# eval/golden_set.yaml
#
# Golden set — 32 вопроса из реального содержимого chunks.json (SEBU7844-37).
# Каждый ответ верифицирован прямым чтением чанков.
#
# Формат:
#   expected_contains: строки, которые ОБЯЗАНЫ присутствовать в ответе
#   must_not_contain:  строки, которых в ответе быть НЕ ДОЛЖНО
#
#   Элемент expected_contains бывает двух видов:
#
#     - "205 kPa"              СТРОГО. Проверяется вхождение ровно этой строки.
#                              Так задаётся всё непереводимое: числа с
#                              единицами, номера деталей (1U-5490), коды
#                              (ADEM III, SEBU7844-37), номера страниц.
#                              Ослаблять это нельзя — здесь и живёт защита
#                              от выдуманных значений.
#
#     - ["wiring", "проводк"]  ЛЮБОЙ ИЗ ВАРИАНТОВ. Так задаётся переводимое:
#                              понятия, которые система по правилу 7 системного
#                              промпта передаёт на языке вопроса. Вопросы у нас
#                              русские, значит и ответ русский, и требовать
#                              английское 'wiring' — проверять язык, а не
#                              знание. Русские варианты даются основой слова
#                              («проводк»), потому что сравнение идёт по
#                              вхождению подстроки и падежи заранее не известны.
#
#   Граница проходит по смыслу, а не по удобству: если значение при переводе
#   меняет форму — оно переводимое; если обязано остаться посимвольно тем же —
#   строгое. Список альтернатив НЕ повод внести туда то, что система сейчас
#   отвечает; он нужен только там, где верны оба варианта.
#   expected_pages:    [start, end] — ссылка на страницы из документа
#
#   target_chunk:      НЕОБЯЗАТЕЛЬНОЕ. Описание чанка, который поиск обязан
#                      поднять наверх. Используется только ретривальной
#                      оценкой (make eval-retrieval), на make eval не влияет.
#
#                      Чанк задаётся ПО СОДЕРЖИМОМУ, а не по id: id меняются
#                      при каждой переиндексации, содержимое нет.
#                      Поля складываются по И:
#                        doc                — имя файла документа
#                        heading_startswith — начало заголовка чанка
#                        content_contains   — подстрока в тексте чанка
#                        control_module     — 'ADEM II' | 'ADEM III'
#
#                      Предикат МОЖЕТ совпасть с несколькими чанками, и это
#                      законно: длинная процедура разбита на части, а блоки
#                      WARNING/NOTICE по правилу 4 CLAUDE.md дублируются
#                      в каждую часть. Метрика берёт лучший ранг из совпавших.
#
#                      У вопросов категории honest_refusal целевого чанка нет
#                      по определению — правильного ответа в мануале не
#                      существует. Они из ретривальной метрики исключаются.
#   category:
#     number_accuracy  — точность числового значения с единицами
#     part_number      — номер детали
#     correct_variant  — правильный вариант процедуры (ADEM II vs III, ELC vs DEAC)
#     honest_refusal   — информации нет в O&M, должен отказать
#     step_count       — корректное число или порядок шагов
#     procedure_detail — конкретная деталь процедуры
#     ru_no_anchor     — чисто русская формулировка, БЕЗ латинского якоря
#
#   ─── Категория ru_no_anchor ───────────────────────────────────────────────
#
#   Замер 2026-08-03 на 28 размеченных вопросах: латинский технический якорь
#   (aftercooler, Hydrosolv, air shutoff, ADEM III, Cat DEAC) есть у 26 из 28.
#   Нет ровно у gs022 и gs031 — и прочерк в колонке sparse у make eval-retrieval
#   стоит ровно у них двоих, в обоих плечах. Расхождений ноль.
#
#   Голые номера моделей (3512B, C18) якорями НЕ считаются: токен есть,
#   различающей силы нет, они встречаются в сотнях чанков.
#
#   Значит sparse-ветвь на этом корпусе работает исключительно на латинских
#   токенах и на чисто русском запросе не даёт НИЧЕГО — не мало, а ноль.
#   Golden set это скрывал: он писался по английскому тексту мануала, и почти
#   каждая формулировка несла кусок этого текста внутри себя.
#
#   Вопросы ru_no_anchor написаны, чтобы это измерить. Правила авторства:
#     • сначала выбирается целевой чанк, потом пишется вопрос — не наоборот;
#     • формулировка чистой кириллицей: без латинских терминов, без кодов
#       публикаций, без номеров деталей В ВОПРОСЕ (в ответе — сколько угодно);
#     • ни один вопрос не прогонялся через систему до того, как были написаны
#       все десять. Иначе автор бессознательно подгоняет формулировки под то,
#       что находится, и получается тест, который проходим по построению.
#
#   expected_contains у них НЕТ намеренно: они предназначены для
#   детерминированной ретривальной оценки, а не для генеративной.
#   make eval такие вопросы пропускает и говорит об этом вслух — вопрос
#   без ожиданий прошёл бы даром и завысил счёт.
#
#     make eval-retrieval CAT=ru_no_anchor
#     make eval-retrieval CAT=ru_no_anchor M="3512B"

